<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de firmas de correo</title>
<style>
  /* ============================================================
     ESTILOS DE LA PÁGINA DEL GENERADOR (esto NO es la firma,
     es solo el "vestido" del formulario que ve el empleado)
     ============================================================ */
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 30px 16px;
    color: #1a1a1a;
  }
  .contenedor {
    max-width: 640px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 10px;
    padding: 28px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  h1 { font-size: 20px; margin-top: 0; }
  label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    color: #444;
    margin-top: 16px;
    margin-bottom: 4px;
  }
  input[type=text], select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }
  .fila-dos { display: flex; gap: 12px; }
  .fila-dos > div { flex: 1; }
  .opcional { font-weight: normal; color: #999; font-size: 11px; }
  button#btnGenerar {
    margin-top: 22px;
    width: 100%;
    padding: 12px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
  }
  button#btnGenerar:hover { background: #333; }
  #resultado { margin-top: 28px; display: none; }
  #vistaPrevia {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 16px;
    background: #fafafa;
    overflow-x: auto;
  }
  .accionesFirma {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-top: 12px;
  }
  .accionesFirma button {
    width: 100%;
    padding: 11px;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  #btnCopiar { background: #0a7d3c; }
  #btnCopiarHtml { background: #365899; }
  #btnDescargarHtml { background: #6b4f9b; }
  .errorCampo { border-color: #c62828 !important; background:#fff7f7; }
  #mensajeAccion {
    display: none;
    color: #0a7d3c;
    font-size: 13px;
    text-align: center;
    margin-top: 6px;
  }
  #mensajeCopiado {
    display: none;
    color: #0a7d3c;
    font-size: 13px;
    text-align: center;
    margin-top: 6px;
  }

  /* Adaptación para móviles */
  input[type=text], select, button { min-height: 44px; }
  @media (max-width: 640px) {
    body { padding: 0; background: #ffffff; }
    .contenedor { width:100%; max-width:none; min-height:100vh; border-radius:0; padding:20px 16px 32px; box-shadow:none; }
    h1 { font-size:22px; line-height:1.25; }
    input[type=text], select { font-size:16px; padding:12px; }
    .fila-dos { display:block; }
    .accionesFirma { grid-template-columns:1fr; }
    .accionesFirma button { width:100%; }
    #vistaPrevia { padding:10px; -webkit-overflow-scrolling:touch; }
    #vistaPrevia > table { transform-origin:top left; }
  }
</style>
</head>
<body>

<div class="contenedor">
  <h1>Generador de firma de correo</h1>
  <p id="avisoEntorno" style="display:none; margin:0 0 14px; padding:10px 12px; border-radius:6px; background:#fff4d6; color:#6b5200; font-size:13px; line-height:1.4;"></p>

  <!-- El formulario visible se construye en la Parte 2 -->
  <div id="formulario"></div>

  <button id="btnGenerar">Generar mi firma</button>

  <div id="resultado">
    <label>Vista previa</label>
    <div id="vistaPrevia"></div>
    <div class="accionesFirma">
      <button id="btnCopiar" type="button">Copiar firma con formato</button>
      <button id="btnCopiarHtml" type="button">Copiar código HTML</button>
      <button id="btnDescargarHtml" type="button">Descargar firma HTML para Thunderbird</button>
    </div>
    <div id="mensajeAccion"></div>
  </div>
</div>

<script>
/* ============================================================
   PARTE 1 — CONFIGURACIÓN
   Aquí vive TODA la información de cada empresa: logos, colores,
   oficinas, teléfonos, webs, redes sociales...
   Todo lo marcado con "SUSTITUYE" es un dato de ejemplo (falso)
   que debes cambiar por el dato real de tu empresa.
   ============================================================ */

const CONFIG = {

  // Tu usuario de GitHub. Con esto se construyen las URLs de las
  // imágenes (logos e iconos) que subiste en la Fase 2.
  githubUser: "decomesu-cell",     // <-- SUSTITUYE por tu usuario real de GitHub
  repoName: "generador-firmas",         // nombre del repositorio (déjalo si no lo cambiaste)

  empresas: {

    // ---------------------- ALMANTOUR ----------------------
    almantour: {
      nombreMostrado: "Almantour",
      colorAcento: "#E8590C",
      logoCuadrado: "assets/almantour/logo-cuadrado.png",
      logoHorizontal: "assets/almantour/logo-horizontal.png",
      web: "www.almantour.es",             // <-- SUSTITUYE por la web real (si es distinta)
      dominioEmail: "almantour.com",        // <-- SUSTITUYE por el dominio real del email

      // Cargos habituales en esta empresa. Aparecerán como sugerencias
      // en el formulario, pero el empleado puede escribir uno distinto
      // si el suyo no está en la lista. Añade o quita los que quieras.
      cargosComunes: [
        "Departamento de ventas",           // <-- SUSTITUYE/AMPLÍA esta lista
        "Gestión de viajes",
        "Atención al cliente",
        "Dirección"
      ],

      // Almantour tiene 2 oficinas. La de Almansa ES la línea de
      // urgencias/WhatsApp 24h. La de Caudete tiene su propio
      // teléfono, y además muestra el de urgencias como referencia.
      tieneVariasOficinas: true,
      oficinas: {
        almansa: {
          etiqueta: "Oficina Almansa",
          telefono: "967 34 33 46",         // <-- SUSTITUYE si cambia
          esLineaUrgencias: true,           // esta oficina ES la línea de emergencias
          direccion: "Corredera 43, Almansa (Albacete)" // <-- SUSTITUYE si cambia
        },
        caudete: {
          etiqueta: "Oficina Caudete",
          telefono: "965 82 72 26",         // <-- SUSTITUYE por el teléfono REAL de Caudete
          esLineaUrgencias: false,
          telefonoUrgenciasReferencia: "967 34 33 46", // el de Almansa, no lo toques salvo que cambie
          direccion: "Calle Ejemplo 5, Caudete (Albacete)" // <-- SUSTITUYE por la dirección REAL
        }
      },

      redes: {
        facebook: "https://facebook.com/tuempresa",   // <-- SUSTITUYE por tu URL real
        instagram: "https://instagram.com/tuempresa", // <-- SUSTITUYE por tu URL real
        linkedin: "https://linkedin.com/company/tuempresa", // <-- SUSTITUYE
        whatsapp: "https://wa.me/34967343346"         // <-- SUSTITUYE si procede
      }
    },

    // ---------------------- MONTESCAR ----------------------
    montescar: {
      nombreMostrado: "Montescar",
      colorAcento: "#C9A227",
      logoCuadrado: "assets/montescar/logo-cuadrado.png",
      logoHorizontal: "assets/montescar/logo-horizontal.png",
      web: "www.montescar.com",            // <-- SUSTITUYE por la web real
      dominioEmail: "montescar.com",       // <-- SUSTITUYE por el dominio real del email

      // Cargos habituales en esta empresa (ver comentario equivalente
      // en Almantour más arriba)
      cargosComunes: [
        "Asistente de Dirección Comercial", // <-- SUSTITUYE/AMPLÍA esta lista
        "Administración",
        "Comercial"
      ],

      // Montescar solo tiene una oficina (si en el futuro tiene más,
      // se copia el patrón de "almantour" de arriba)
      tieneVariasOficinas: false,
      oficinas: {
        principal: {
          etiqueta: "",                     // vacío = no se muestra etiqueta de oficina
          telefono: "967 00 00 00",         // <-- SUSTITUYE por el teléfono REAL
          esLineaUrgencias: false,
          direccion: "Calle Ejemplo 8, Almansa (Albacete)" // <-- SUSTITUYE por la dirección REAL
        }
      },

      redes: {
        facebook: "https://facebook.com/tuempresa",    // <-- SUSTITUYE
        instagram: "https://instagram.com/tuempresa",  // <-- SUSTITUYE
        linkedin: "https://linkedin.com/company/tuempresa", // <-- SUSTITUYE
        whatsapp: "https://wa.me/34967000000"           // <-- SUSTITUYE (número en formato internacional)
      }
    }

  },

  // Texto legal corto que aparece al final de toda firma
  disclaimer: "Aviso legal: este mensaje puede contener información confidencial. Si no es el destinatario, notifíquelo y elimínelo. Tratamos sus datos conforme al RGPD."
};

// A partir de aquí, esto ya no hay que tocarlo para cambiar datos:
// construye la URL base donde viven las imágenes en GitHub Pages
function urlImagen(rutaRelativa) {
  return `https://${CONFIG.githubUser}.github.io/${CONFIG.repoName}/${rutaRelativa}`;
}
</script>

<script>
/* ============================================================
   PARTE 2 — CONSTRUCCIÓN DEL FORMULARIO
   Genera automáticamente los campos del formulario según las
   empresas y oficinas definidas en CONFIG (Parte 1).
   No necesitas tocar nada aquí al añadir una empresa nueva.
   ============================================================ */

const contenedorFormulario = document.getElementById('formulario');

// Construye las <option> del selector de empresa
function opcionesEmpresas() {
  return Object.entries(CONFIG.empresas)
    .map(([clave, empresa]) => `<option value="${clave}">${empresa.nombreMostrado}</option>`)
    .join('');
}

// Construye las <option> del selector de oficina para una empresa dada
function opcionesOficinas(claveEmpresa) {
  const empresa = CONFIG.empresas[claveEmpresa];
  return Object.entries(empresa.oficinas)
    .map(([clave, oficina]) => `<option value="${clave}">${oficina.etiqueta || empresa.nombreMostrado}</option>`)
    .join('');
}

// Lee "?empresa=almantour" de la URL. Si el enlace que se le da a
// cada empleado incluye este parámetro, el formulario queda BLOQUEADO
// a esa empresa (sin desplegable, sin poder elegir otra).
// Si no hay parámetro (por ejemplo, al probar el archivo tú mismo),
// se muestra el desplegable normal con todas las empresas.
function empresaFijadaPorURL() {
  const parametros = new URLSearchParams(window.location.search);
  const clave = parametros.get('empresa');
  return (clave && CONFIG.empresas[clave]) ? clave : null;
}

const claveEmpresaFija = empresaFijadaPorURL();

// Pantalla inicial: botones grandes para elegir empresa (se usa cuando
// el enlace NO trae "?empresa=..." todavía, por ejemplo la primera vez
// que alguien entra al enlace genérico)
function pantallaSeleccionEmpresa() {
  const botones = Object.entries(CONFIG.empresas).map(([clave, empresa]) => `
    <button type="button" class="botonEmpresa" data-clave="${clave}"
      style="display:block; width:100%; padding:16px; margin-bottom:10px; border:1px solid #ddd;
             border-radius:8px; background:#fff; font-size:15px; font-weight:bold; cursor:pointer; text-align:left;">
      ${empresa.nombreMostrado}
    </button>`).join('');
  return `<p style="color:#555; font-size:14px; margin-top:0;">¿Para qué empresa quieres generar tu firma?</p>${botones}`;
}

if (!claveEmpresaFija) {
  // --- MODO SELECCIÓN: aún no sabemos la empresa, mostramos los botones ---
  contenedorFormulario.innerHTML = pantallaSeleccionEmpresa();
  document.getElementById('btnGenerar').style.display = 'none';
  contenedorFormulario.querySelectorAll('.botonEmpresa').forEach(boton => {
    boton.addEventListener('click', () => {
      // Recargamos la página con "?empresa=..." en la URL: a partir de
      // ahí entra en el otro caso (MODO FORMULARIO) ya bloqueada a esa empresa.
      window.location.search = `?empresa=${boton.getAttribute('data-clave')}`;
    });
  });

} else {
  // --- MODO FORMULARIO: la empresa ya está decidida, construimos todo lo demás ---
  contenedorFormulario.innerHTML = `
    <label>Empresa</label>
    <input type="hidden" id="campoEmpresa" value="${claveEmpresaFija}">
    <div style="padding:9px 10px; background:#f0f0f0; border-radius:6px; font-size:14px; color:#555;">
      ${CONFIG.empresas[claveEmpresaFija].nombreMostrado}
      <a href="${window.location.pathname}" style="float:right; font-size:12px; color:#888;">(cambiar)</a>
    </div>

    <div id="filaOficina" style="display:none;">
      <label>Oficina</label>
      <select id="campoOficina"></select>
    </div>

    <div class="fila-dos">
      <div>
        <label>Nombre</label>
        <input type="text" id="campoNombre" placeholder="Nombre">
      </div>
      <div>
        <label>Apellidos</label>
        <input type="text" id="campoApellidos" placeholder="Apellidos">
      </div>
    </div>

    <label>Cargo</label>
    <select id="campoCargo"></select>
    <input type="text" id="campoCargoOtro" placeholder="Escribe tu cargo" style="display:none; margin-top:8px;">

    <label>Email</label>
    <input type="text" id="campoEmail" placeholder="Escribe tu email; el dominio se completa solo al poner @">

    <label>Móvil <span class="opcional">(opcional, 9 cifras)</span></label>
    <input type="text" id="campoMovil" placeholder="600 00 00 00" inputmode="numeric" autocomplete="tel" maxlength="12" pattern="[0-9]{3} [0-9]{2} [0-9]{2} [0-9]{2}">

    <label>Estilo de firma</label>
    <select id="campoEstilo"></select>
  `;

  const campoEmpresa = document.getElementById('campoEmpresa');
  const filaOficina = document.getElementById('filaOficina');
  const campoOficina = document.getElementById('campoOficina');

  // Muestra/oculta el selector de oficina según si la empresa elegida tiene varias
  function actualizarOficinas() {
    const empresa = CONFIG.empresas[campoEmpresa.value];
    if (empresa.tieneVariasOficinas) {
      filaOficina.style.display = 'block';
      campoOficina.innerHTML = opcionesOficinas(campoEmpresa.value);
    } else {
      filaOficina.style.display = 'none';
    }
  }

  // Rellena el selector de cargo. En móvil, un <select> funciona
  // mejor que un <datalist>. La opción "Otro cargo" permite escribir uno distinto.
  function actualizarCargosSugeridos() {
    const empresa = CONFIG.empresas[campoEmpresa.value];
    const campoCargo = document.getElementById('campoCargo');
    campoCargo.innerHTML = `
      <option value="">Selecciona un cargo</option>
      ${(empresa.cargosComunes || []).map(c => `<option value="${c}">${c}</option>`).join('')}
      <option value="__otro__">Otro cargo...</option>
    `;
  }

  document.getElementById('campoCargo').addEventListener('change', (e) => {
    const campoOtro = document.getElementById('campoCargoOtro');
    const esOtro = e.target.value === '__otro__';
    campoOtro.style.display = esOtro ? 'block' : 'none';
    if (!esOtro) campoOtro.value = '';
    if (esOtro) campoOtro.focus();
  });

  // Autocompleta el dominio del email en cuanto el usuario escribe "@".
  // Ejemplo: el empleado escribe "ana@" y el campo pasa a "ana@almantour.com"
  // automáticamente. Así cada uno escribe su email tal cual lo conoce
  // (no todos siguen el patrón nombre.apellido), y el dominio —que es
  // fijo por empresa y el que más errores de escritura suele tener— no
  // hay que teclearlo.
  document.addEventListener('input', (e) => {
    if (e.target.id === 'campoEmail') {
      const empresa = CONFIG.empresas[campoEmpresa.value];
      if (e.target.value.endsWith('@')) {
        e.target.value += empresa.dominioEmail;
      }
    }
  });

  // El móvil admite exclusivamente 9 cifras y las muestra siempre como 600 00 00 00.
  const campoMovil = document.getElementById('campoMovil');
  campoMovil.addEventListener('input', () => {
    const digitos = campoMovil.value.replace(/\D/g, '').slice(0, 9);
    const grupos = [];
    if (digitos.length) grupos.push(digitos.slice(0, 3));
    if (digitos.length > 3) grupos.push(digitos.slice(3, 5));
    if (digitos.length > 5) grupos.push(digitos.slice(5, 7));
    if (digitos.length > 7) grupos.push(digitos.slice(7, 9));
    campoMovil.value = grupos.join(' ');
    campoMovil.classList.remove('errorCampo');
  });

  campoMovil.addEventListener('keydown', (e) => {
    const permitidas = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Home', 'End'];
    if (!/^[0-9]$/.test(e.key) && !permitidas.includes(e.key) && !(e.ctrlKey || e.metaKey)) {
      e.preventDefault();
    }
  });

  actualizarOficinas();        // estado inicial al cargar la página
  actualizarCargosSugeridos(); // idem
}
</script>

<script>
/* ============================================================
   PARTE 3 — GENERACIÓN DE LA FIRMA
   Aquí se construye el HTML final de la firma (con tablas,
   compatible con Outlook/Gmail/Apple Mail), usando los datos
   del formulario + la configuración de la empresa elegida.
   ============================================================ */

// Icono real (imagen) para WhatsApp / 24h / redes sociales
function iconoImagen(ruta, alt, tam) {
  return `<img src="${urlImagen(ruta)}" alt="${alt}" width="${tam}" height="${tam}" style="display:inline-block; vertical-align:middle; border:0;">`;
}

// Bloque de "urgencias 24h" con icono de WhatsApp + insignia 24H
function bloqueUrgencias(telefono, compacto) {
  const tamIcono = 14;
  return `${telefono} ${iconoImagen('assets/iconos/icono-whatsapp.png','WhatsApp',tamIcono)} ${iconoImagen('assets/iconos/icono-24h.png','Urgencias 24h',tamIcono)}`;
}

// Fila de iconos de redes sociales (solo las que la empresa tenga configuradas)
function filaRedesSociales(redes) {
  const iconosPorClave = {
    facebook: 'assets/iconos/icono-facebook.png',
    instagram: 'assets/iconos/icono-instagram.png',
    linkedin: 'assets/iconos/icono-linkedin.png',
    whatsapp: 'assets/iconos/icono-whatsapp_gris.png'
  };
  return Object.entries(redes).map(([clave, url]) => {
    const ruta = iconosPorClave[clave];
    if (!ruta) return '';
    return `<a href="${url}" style="text-decoration:none; padding-right:6px;">${iconoImagen(ruta, clave, 18)}</a>`;
  }).join('');
}

function telefonoSinEspacios(telefono) {
  return String(telefono || '').replace(/\D/g, '');
}

function enlaceTelefono(telefono, contenido) {
  return `<a href="tel:+34${telefonoSinEspacios(telefono)}" style="color:#333333; text-decoration:none;">${contenido || telefono}</a>`;
}

function enlaceDireccion(direccion) {
  const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(direccion)}`;
  return `<a href="${url}" style="color:#333333; text-decoration:none;">${direccion}</a>`;
}

function escaparHtml(texto) {
  return String(texto || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function mostrarMensaje(texto, esError = false) {
  const msg = document.getElementById('mensajeAccion');
  msg.textContent = texto;
  msg.style.color = esError ? '#c62828' : '#0a7d3c';
  msg.style.display = 'block';
  clearTimeout(mostrarMensaje.temporizador);
  mostrarMensaje.temporizador = setTimeout(() => { msg.style.display = 'none'; }, 5000);
}

function validarFormulario() {
  const requeridos = ['campoNombre', 'campoApellidos', 'campoEmail'];
  let valido = true;
  requeridos.forEach(id => {
    const campo = document.getElementById(id);
    campo.classList.toggle('errorCampo', !campo.value.trim());
    if (!campo.value.trim()) valido = false;
  });

  const campoCargo = document.getElementById('campoCargo');
  const campoCargoOtro = document.getElementById('campoCargoOtro');
  const cargoValido = campoCargo.value && (campoCargo.value !== '__otro__' || campoCargoOtro.value.trim());
  campoCargo.classList.toggle('errorCampo', !cargoValido);
  campoCargoOtro.classList.toggle('errorCampo', campoCargo.value === '__otro__' && !campoCargoOtro.value.trim());
  if (!cargoValido) valido = false;

  const email = document.getElementById('campoEmail');
  const emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
  email.classList.toggle('errorCampo', !emailValido);
  if (!emailValido) valido = false;

  const movil = document.getElementById('campoMovil');
  const cifrasMovil = telefonoSinEspacios(movil.value);
  const movilValido = !cifrasMovil || cifrasMovil.length === 9;
  movil.classList.toggle('errorCampo', !movilValido);
  if (!movilValido) valido = false;

  if (!valido) mostrarMensaje('Revisa los campos marcados. El móvil debe tener exactamente 9 cifras.', true);
  return valido;
}

// Recoge todos los datos del formulario en un único objeto.
// Busca los campos directamente por id (con document.getElementById)
// en vez de depender de variables de la Parte 2, para que esta parte
// funcione con independencia de cómo se haya construido el formulario.
function recogerDatosFormulario() {
  const claveEmpresa = document.getElementById('campoEmpresa').value;
  const empresa = CONFIG.empresas[claveEmpresa];
  const elementoOficina = document.getElementById('campoOficina');
  const claveOficina = empresa.tieneVariasOficinas ? elementoOficina.value : Object.keys(empresa.oficinas)[0];
  const oficina = empresa.oficinas[claveOficina];

  return {
    empresa,
    oficina,
    nombreCompleto: `${document.getElementById('campoNombre').value} ${document.getElementById('campoApellidos').value}`.trim(),
    cargo: document.getElementById('campoCargo').value === '__otro__'
      ? document.getElementById('campoCargoOtro').value.trim()
      : document.getElementById('campoCargo').value.trim(),
    email: document.getElementById('campoEmail').value.trim(),
    movil: document.getElementById('campoMovil').value.trim(),
    estilo: document.getElementById('campoEstilo').value
  };
}

// -------- ESTILO 1: COMBINADA (logo + línea vertical de color) --------
function generarFirmaCombinada(d) {
  const e = d.empresa;
  const telefonoLinea = d.oficina.esLineaUrgencias
    ? `${enlaceTelefono(d.oficina.telefono)} ${iconoImagen('assets/iconos/icono-whatsapp.png','WhatsApp',14)} ${iconoImagen('assets/iconos/icono-24h.png','24h',14)}`
    : enlaceTelefono(d.oficina.telefono);

  const filaUrgenciasReferencia = (!d.oficina.esLineaUrgencias && d.oficina.telefonoUrgenciasReferencia)
    ? `<tr><td style="font-size:11px; color:#777777; padding-bottom:4px; padding-left:22px;">
         Urgencias ${enlaceTelefono(d.oficina.telefonoUrgenciasReferencia)} ${iconoImagen('assets/iconos/icono-whatsapp.png','WhatsApp',13)} ${iconoImagen('assets/iconos/icono-24h.png','24h',13)}
       </td></tr>` : '';

  const filaMovil = d.movil
    ? `<tr><td style="font-size:12px; color:#333333; padding-bottom:4px;">${iconoImagen('assets/iconos/icono-movil.png','Móvil',14)}&nbsp;&nbsp;${enlaceTelefono(d.movil)}</td></tr>` : '';

  const filaOficinaEtiqueta = d.oficina.etiqueta
    ? `<tr><td style="font-size:10.5px; color:#999999; text-transform:uppercase; letter-spacing:0.5px; padding-bottom:8px;">${d.oficina.etiqueta}</td></tr>`
    : `<tr><td style="padding-bottom:4px;"></td></tr>`;

  return `
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; width:540px;">
  <tr>
    <td style="vertical-align:middle; padding-right:16px; width:100px;">
      <img src="${urlImagen(e.logoCuadrado)}" alt="${e.nombreMostrado}" width="90" style="display:block; border:0;">
    </td>
    <td style="vertical-align:middle; width:16px; padding:0;">
      <table cellpadding="0" cellspacing="0" border="0" style="height:100px;"><tr><td style="width:2px; background-color:${e.colorAcento}; font-size:0; line-height:0;">&nbsp;</td></tr></table>
    </td>
    <td style="vertical-align:top; padding-left:16px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr><td style="font-size:15px; font-weight:bold; color:#1a1a1a; letter-spacing:0.3px; padding-bottom:1px;">${d.nombreCompleto.toUpperCase()}</td></tr>
        <tr><td style="font-size:12px; color:#777777; padding-bottom:3px;">${d.cargo}</td></tr>
        ${filaOficinaEtiqueta}

        <tr><td style="font-size:12.5px; color:#333333; padding-bottom:3px;">${iconoImagen('assets/iconos/icono-telefono.png','Tel',14)}&nbsp;&nbsp;${telefonoLinea}</td></tr>
        ${filaUrgenciasReferencia}
        ${filaMovil}

        <tr><td style="font-size:12px; padding-bottom:4px;">${iconoImagen('assets/iconos/icono-email.png','Email',14)}&nbsp;&nbsp;<a href="mailto:${d.email}" style="color:#333333; text-decoration:none;">${d.email}</a></td></tr>

        <tr><td style="font-size:12px; color:#333333; padding-bottom:4px;">${iconoImagen('assets/iconos/icono-direccion.png','Dirección',14)}&nbsp;&nbsp;${enlaceDireccion(d.oficina.direccion)}</td></tr>

        <tr><td style="font-size:12px; padding-bottom:8px;">${iconoImagen('assets/iconos/icono-web.png','Web',14)}&nbsp;&nbsp;<a href="https://${e.web}" style="color:${e.colorAcento}; text-decoration:none;">${e.web}</a></td></tr>

        <tr><td style="padding-bottom:8px;">${filaRedesSociales(e.redes)}</td></tr>
      </table>
    </td>
  </tr>
  <tr><td colspan="3" style="padding-top:10px; border-top:1px solid #eeeeee; font-size:9px; color:#aaaaaa; line-height:13px;">
    ${CONFIG.disclaimer}
  </td></tr>
</table>`;
}

// -------- ESTILO 2: MINIMALISTA --------
function generarFirmaMinimalista(d) {
  const e = d.empresa;
  const lineaUrgencias = d.oficina.esLineaUrgencias
    ? ` ${iconoImagen('assets/iconos/icono-whatsapp.png','WhatsApp',13)} ${iconoImagen('assets/iconos/icono-24h.png','24h',13)}`
    : '';
  const filaMovil = d.movil ? `<tr><td style="font-size:12px; color:#333333; padding-bottom:3px;">${enlaceTelefono(d.movil)}</td></tr>` : '';
  const filaUrgenciasReferencia = (!d.oficina.esLineaUrgencias && d.oficina.telefonoUrgenciasReferencia)
    ? `<tr><td style="font-size:11.5px; color:#666666; padding-bottom:4px;">Urgencias ${enlaceTelefono(d.oficina.telefonoUrgenciasReferencia)} ${iconoImagen('assets/iconos/icono-whatsapp.png','WhatsApp',13)} ${iconoImagen('assets/iconos/icono-24h.png','24h',13)}</td></tr>`
    : '';

  return `
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; width:440px;">
  <tr><td style="padding-bottom:16px;"><img src="${urlImagen(e.logoHorizontal)}" alt="${e.nombreMostrado}" width="130" style="display:block; border:0;"></td></tr>
  <tr><td style="font-size:16px; font-weight:bold; color:#1a1a1a; padding-bottom:2px;">${d.nombreCompleto}</td></tr>
  <tr><td style="font-size:12.5px; color:#888888; padding-bottom:14px;">${d.cargo}${d.oficina.etiqueta ? ' · ' + d.oficina.etiqueta : ''}</td></tr>

  <tr><td style="font-size:12px; color:#333333; padding-bottom:4px;">${enlaceTelefono(d.oficina.telefono)}${lineaUrgencias}</td></tr>
  ${filaUrgenciasReferencia}
  ${filaMovil}
  <tr><td style="font-size:12px; padding-bottom:4px;"><a href="mailto:${d.email}" style="color:#333333; text-decoration:none;">${d.email}</a></td></tr>
  <tr><td style="font-size:12px; color:#777777; padding-bottom:4px;">${enlaceDireccion(d.oficina.direccion)}</td></tr>
  <tr><td style="font-size:12px; padding-bottom:14px;"><a href="https://${e.web}" style="color:${e.colorAcento}; text-decoration:none;">${e.web}</a></td></tr>

  <tr><td style="padding-bottom:10px;">${filaRedesSociales(e.redes)}</td></tr>
  <tr><td style="font-size:9px; color:#cccccc; line-height:13px;">${CONFIG.disclaimer}</td></tr>
</table>`;
}

/* ============================================================
   REGISTRO DE DISEÑOS
   Aquí se apuntan todos los estilos de firma disponibles.

   CÓMO AÑADIR UN DISEÑO NUEVO EN EL FUTURO (sin tocar nada más):
     1. Escribe una función nueva "generarFirmaTuNombre(d)" arriba,
        siguiendo el mismo patrón que las dos que ya existen
        (recibe los datos "d" y devuelve un string de HTML con tablas).
     2. Añade una línea aquí abajo, por ejemplo:
          tuClave: { etiqueta: "Nombre que verá el empleado", generar: generarFirmaTuNombre }
     3. Listo — aparecerá solo en el desplegable del formulario,
        no hay que tocar ni el formulario ni el botón de generar.
   ============================================================ */
const ESTILOS = {
  combinada:   { etiqueta: "Combinada (logo + línea de color)", generar: generarFirmaCombinada },
  minimalista: { etiqueta: "Minimalista",                        generar: generarFirmaMinimalista }
};

// Rellena el desplegable de estilos a partir del registro de arriba
// (solo si ya estamos en modo formulario, es decir, si la empresa
// ya está decidida — en la pantalla de selección este campo no existe)
if (claveEmpresaFija) {
  document.getElementById('campoEstilo').innerHTML = Object.entries(ESTILOS)
    .map(([clave, estilo]) => `<option value="${clave}">${estilo.etiqueta}</option>`)
    .join('');
}

// -------- BOTÓN GENERAR --------
document.getElementById('btnGenerar').addEventListener('click', () => {
  if (!validarFormulario()) return;
  const datos = recogerDatosFormulario();
  const html = ESTILOS[datos.estilo].generar(datos);
  const vista = document.getElementById('vistaPrevia');
  vista.innerHTML = html;
  document.getElementById('resultado').style.display = 'block';
  document.getElementById('resultado').scrollIntoView({ behavior: 'smooth' });
});

// -------- ACCIONES DE SALIDA --------
document.getElementById('btnCopiar').addEventListener('click', async () => {
  const vista = document.getElementById('vistaPrevia');
  const htmlBlob = new Blob([vista.innerHTML], { type: 'text/html' });
  const textBlob = new Blob([vista.innerText], { type: 'text/plain' });
  try {
    await navigator.clipboard.write([
      new ClipboardItem({ 'text/html': htmlBlob, 'text/plain': textBlob })
    ]);
    mostrarMensaje('✔ Firma copiada con formato.');
  } catch (err) {
    mostrarMensaje('No se pudo copiar automáticamente. Selecciona la firma y usa Ctrl+C.', true);
  }
});

document.getElementById('btnCopiarHtml').addEventListener('click', async () => {
  const html = document.getElementById('vistaPrevia').innerHTML.trim();
  try {
    await navigator.clipboard.writeText(html);
    mostrarMensaje('✔ Código HTML copiado como texto.');
  } catch (err) {
    mostrarMensaje('No se pudo copiar el código HTML.', true);
  }
});

document.getElementById('btnDescargarHtml').addEventListener('click', () => {
  const datos = recogerDatosFormulario();
  const firma = document.getElementById('vistaPrevia').innerHTML.trim();
  const documento = `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Firma de ${escaparHtml(datos.nombreCompleto)}</title>
</head>
<body>${firma}</body>
</html>`;
  const nombreArchivo = `firma-${datos.nombreCompleto || datos.empresa.nombreMostrado}`
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '') + '.html';
  const blob = new Blob([documento], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const enlace = document.createElement('a');
  enlace.href = url;
  enlace.download = nombreArchivo;
  document.body.appendChild(enlace);
  enlace.click();
  enlace.remove();
  URL.revokeObjectURL(url);
  mostrarMensaje('✔ Archivo HTML descargado para usarlo en Thunderbird.');
});
</script>


<script>
(function prepararUsoMovil() {
  const aviso = document.getElementById('avisoEntorno');
  if (window.location.protocol === 'file:') {
    aviso.textContent = 'Para probar todas las funciones en el móvil, abre esta aplicación desde una dirección HTTPS. La vista previa local puede bloquear la copia al portapapeles.';
    aviso.style.display = 'block';
  }
  function ajustarVistaPreviaMovil() {
    const vista = document.getElementById('vistaPrevia');
    const firma = vista ? vista.querySelector('table') : null;
    if (!vista || !firma) return;
    firma.style.transform = '';
    firma.style.marginBottom = '';
    if (window.innerWidth <= 640) {
      const anchoDisponible = vista.clientWidth - 2;
      const anchoFirma = firma.scrollWidth || firma.offsetWidth;
      if (anchoFirma > anchoDisponible) {
        const escala = anchoDisponible / anchoFirma;
        firma.style.transform = 'scale(' + escala + ')';
        firma.style.marginBottom = -(firma.offsetHeight * (1 - escala)) + 'px';
      }
    }
  }
  document.getElementById('btnGenerar').addEventListener('click', function () {
    window.setTimeout(ajustarVistaPreviaMovil, 0);
  });
  window.addEventListener('resize', ajustarVistaPreviaMovil);
})();
</script>
